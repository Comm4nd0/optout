[project]
name = "optout"
version = "0.1.0"
description = "Self-hosted data-broker erasure request tracker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "DATA-LICENSE.md"]
authors = [{ name = "Marco Baldanza" }]
keywords = ["privacy", "gdpr", "ccpa", "data-broker", "opt-out", "erasure", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = [
    "pyyaml>=6",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
forms = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
optout = "optout.cli:main"

[project.urls]
Homepage = "https://github.com/Comm4nd0/optout"
Issues = "https://github.com/Comm4nd0/optout/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optout"]

# the broker list and letter templates travel inside the package; config._bundled() finds them
[tool.hatch.build.targets.wheel.force-include]
"brokers" = "optout/data/brokers"
"templates" = "optout/data/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
